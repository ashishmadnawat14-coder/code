<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Ask</title>
<style>
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
    }

    .container {
        text-align: center;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }

    #startBtn {
        background: #ff4b5c;
        color: white;
    }

    #yesBtn {
        background: #4CAF50;
        color: white;
    }

    #noBtn {
        background: #f44336;
        color: white;
        position: absolute;
        transition: 0.3s;
    }

    #question {
        display: none;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="container">
    <button id="startBtn">Click Me ❤️</button>

    <div id="question">
        <h1>Momo, will you be my Valentine? 💖</h1>
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script>
    const startBtn = document.getElementById("startBtn");
    const question = document.getElementById("question");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    startBtn.onclick = () => {
        startBtn.style.display = "none";
        question.style.display = "block";
        moveNoButton();
    };

    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);

    yesBtn.onclick = () => {
        document.body.innerHTML = "<h1 style='color:white;'>Yayyy! 💕 I knew it 😍</h1>";
    };
</script>

</body>
</html>
